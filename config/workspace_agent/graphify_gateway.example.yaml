{
  "schema_version": "1.0",
  "enabled": true,
  "transport": "stdio",
  "server_name": "tim-workspace-graphify-readonly",
  "authentication_mode": "secure_mcp_tunnel_required",
  "allowed_clients": ["replace-with-approved-workspace-client-id"],
  "allowed_operations": [
    "search_repository_graph",
    "get_graph_node",
    "get_node_neighbors",
    "get_graph_community",
    "get_graph_statistics",
    "get_shortest_path",
    "get_central_nodes",
    "health_check"
  ],
  "read_only": true,
  "max_request_bytes": 16384,
  "max_query_length": 4096,
  "max_results": 20,
  "max_response_bytes": 262144,
  "request_timeout_seconds": 35,
  "max_parallel_requests": 1,
  "rate_limit_requests": 20,
  "rate_limit_window_seconds": 60,
  "max_clock_skew_seconds": 300,
  "replay_window_seconds": 600,
  "audit_to_stderr": true,
  "allow_anonymous": false,
  "allow_unknown_operations": false,
  "allow_writes": false
}
