# Installed by ops/debian/install_checkup.sh. Ollama must never starve tim-runtime or PostgreSQL and never reach the internet.
# AllowedCPUs is not here: the installer writes it to tim-cpus.conf only from an explicit --ollama-cpus value (P0, lscpu -e).
# After this drop-in Ollama listens on 127.0.0.2:11434 only; ollama CLI commands need OLLAMA_HOST=127.0.0.2:11434.
# OLLAMA_MODELS=/srv/tim/models stays as set in ollama.service itself. Never "ollama pull" on this server.
[Service]
Nice=15
CPUWeight=20
CPUQuota=300%
IOSchedulingClass=idle
MemoryMax=28G
MemorySwapMax=0
OOMScoreAdjust=500
IPAddressAllow=localhost
IPAddressDeny=any
Environment=OLLAMA_HOST=127.0.0.2:11434 OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 OLLAMA_KEEP_ALIVE=10m OLLAMA_NO_CLOUD=1
