# tim-core-01: /srv cannot hold a second full copy of the database (needs 2x size + 8 GiB).
# The scratch database goes to tablespace tim_restore_scratch on the second SSD (sda),
# bind-mounted at /var/lib/tim-restore-scratch. See docs/RESTORE_STORAGE_2026-10-20.md.
[Unit]
RequiresMountsFor=/var/lib/tim-restore-scratch

[Service]
ExecStart=
ExecStart=/opt/tim/.venv/bin/python /opt/tim/scripts/tim_db_backup.py restore-test --dir /var/backups/tim --restore-storage-path /var/lib/tim-restore-scratch --restore-tablespace tim_restore_scratch
