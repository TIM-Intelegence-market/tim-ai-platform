
<script>
(() => {
  'use strict';
  const INTERVAL_MS = 5000;
  const MAX_RETRIES = 3;
  // The page body is server-rendered once.  Without a refresh it would keep
  // showing the values from the moment the tab was opened (frozen freshness,
  // stale pipeline, old problems) while only the header badges move.  The
  // body is therefore re-rendered from the server whenever the live state
  // changed, at most every VIEW_MIN_MS and at least every VIEW_MAX_MS.
  const VIEW_MIN_MS = 15000;
  const VIEW_MAX_MS = 60000;
  const VIEW_STALE_MS = 120000;
  let timer = null, retries = 0, viewSignature = null, viewRenderedAt = Date.now(), viewRefreshing = false, viewError = null;
  const byId = id => document.getElementById(id);
  const text = value => value === null || value === undefined || value === '' ? '—' : String(value);
  function set(id, value) { const node=byId(id); if(node) node.textContent=text(value); }
  function status(kind, message) { const el=byId('tim-status'); if(!el)return; el.className=`live badge--${kind}`;el.textContent=`● ${message}`; }
  function countdown(deadline) { const seconds=Math.max(0,Math.floor((new Date(deadline).getTime()-Date.now())/1000));return `${Math.floor(seconds/3600)}h ${String(Math.floor((seconds%3600)/60)).padStart(2,'0')}m ${String(seconds%60).padStart(2,'0')}s`; }
  function update(data) {
    const hdr = (id, sev, label) => { const el = byId(id); if (el) { el.textContent = label; el.dataset.sev = sev; } };
    const op = data.operational_health || {};
    const ageSeconds = op.data_age_seconds;
    const isFresh = typeof ageSeconds === 'number' && ageSeconds >= 0 && ageSeconds <= 120;
    const stream = String(op.stream || 'UNKNOWN').toUpperCase();
    hdr('st-system', op.status === 'GREEN' ? 'ok' : op.status === 'RED' ? 'fail' : op.status === 'YELLOW' ? 'warn' : 'unknown', op.status === 'GREEN' ? 'RUNNING' : op.status === 'RED' ? 'IMPAIRED' : op.status === 'YELLOW' ? 'DEGRADED' : 'UNKNOWN');
    hdr('st-live-data', stream === 'GREEN' ? (isFresh ? 'ok' : 'warn') : stream === 'RED' ? 'fail' : 'unknown', stream === 'GREEN' ? (isFresh ? 'LIVE' : 'STALE') : stream === 'RED' ? 'DOWN' : 'UNKNOWN');
    hdr('st-queue', typeof op.queue_depth === 'number' ? (op.queue_depth === 0 ? 'ok' : 'warn') : 'unknown', typeof op.queue_depth === 'number' ? op.queue_depth + ' EV' : 'UNKNOWN');
    const rolling = (data.operations && data.operations.datasets ? data.operations.datasets : []).slice(-1)[0] || {};
    hdr('st-data-quality', rolling.status ? (String(rolling.status).indexOf('STALE') === 0 ? 'warn' : String(rolling.status).indexOf('FAIL') >= 0 ? 'fail' : String(rolling.status).indexOf('PASS') === 0 ? 'ok' : 'warn') : 'unknown', rolling.coverage || 'UNKNOWN');
    const rg = (data.gate_model && data.gate_model.bands && data.gate_model.bands.research_readiness ? data.gate_model.bands.research_readiness : []).map(g => String((g && g.status) || '').toUpperCase()).filter(Boolean);
    let rSev = 'unknown', rLabel = 'UNKNOWN';
    if (rg.length && !rg.includes('FAIL') && rg.every(s => s === 'PASS')) { rSev = 'ok'; rLabel = 'READY'; }
    else if (rg.length && rg.every(s => s === 'NO_EVIDENCE')) { rSev = 'unknown'; rLabel = 'UNKNOWN'; }
    else if (rg.length && (rg.includes('PASS') || rg.includes('IN_PROGRESS') || rg.includes('LIMITED'))) { rSev = 'warn'; rLabel = 'PARTIAL'; }
    else {
      const rs = String((data.readiness && data.readiness.readiness_status) || 'UNKNOWN');
      rSev = rs.indexOf('NOT_READY') >= 0 ? 'warn' : (rs === 'READY_FOR_V2' || rs === 'READY') ? 'ok' : rs === 'UNKNOWN' ? 'unknown' : 'warn';
      rLabel = rs.indexOf('NOT_READY') >= 0 ? 'NOT READY' : rs === 'READY_FOR_V2' ? 'READY' : rs === 'UNKNOWN' ? 'UNKNOWN' : rs;
    }
    hdr('st-research', rSev, rLabel);
    set('runtime', data.validator?.started_at ? countdown(new Date(Date.now()+(Date.now()-new Date(data.validator.started_at).getTime())).toISOString()) : '—');
    set('acceptance-countdown', data.validator?.deadline ? countdown(data.validator.deadline) : '—');
    set('acceptance-state', `${text(data.validator?.acceptance?.status).toUpperCase()} • ${text(data.validator?.health_monitor?.level)}`);
    set('validator-cycles', data.validator?.cycles || 0);
    set('visible-candles', data.visible_counts?.candles || 0);
    set('visible-observations', data.visible_counts?.observations || 0);
    set('memory-observations', data.memory_status?.observations || data.visible_counts?.observations || 0);
    set('case-active', data.case_counts?.active || 0);set('case-closed',data.case_counts?.closed || 0);
    const health=String(data.operational_health?.status || 'UNKNOWN').toLowerCase();
    const badge=health==='green'?'green':health==='red'?'red':'yellow';
    const label=health==='green'?'Live':health==='red'?'Betriebsstörung':'Status unvollständig';
    status(badge, `${label} · sichtbarer Ausschnitt: ${data.visible_counts?.candles || 0} Candles · ${data.visible_counts?.observations || 0} Beob. · Ansicht ${clock(viewRenderedAt)}`);
    return viewSignatureOf(data);
  }
  function viewSignatureOf(data) {
    const op=data.operational_health||{};
    const lastCandle=(data.candles||[]).slice(-1)[0]||{};
    return JSON.stringify([op.status,op.database,op.stream,op.runtime,op.last_data_at,op.queue_depth,data.validator?.status,data.validator?.last_cycle_at,data.readiness?.readiness_status,data.research_quality?.validation_status,data.visible_counts,data.case_counts?.active,data.case_counts?.closed,lastCandle.timestamp||lastCandle.time||lastCandle.close]);
  }
  function clock(ms) { return new Date(ms).toLocaleTimeString('de-DE'); }
  function viewBusy(main) {
    // Never pull the page away under the user: no refresh while a filter or
    // research field has focus, text is selected, or the research tools hold results.
    const active=document.activeElement;
    if(active&&main.contains(active)&&/^(INPUT|SELECT|TEXTAREA)$/.test(active.tagName))return true;
    const selection=window.getSelection&&window.getSelection();
    if(selection&&!selection.isCollapsed&&main.contains(selection.anchorNode))return true;
    return !!main.querySelector('#quick-run,#deep-run');
  }
  async function refreshView(force) {
    const main=byId('main-content');
    if(!main||viewRefreshing||(!force&&viewBusy(main)))return;
    viewRefreshing=true;
    if(location.pathname==='/setup-path')status('yellow','Neue Daten erkannt – aktualisiere Analyse…');
    const controller=new AbortController(), timeout=setTimeout(()=>controller.abort(),15000);
    try{
      const response=await fetch(location.pathname+location.search,{signal:controller.signal,cache:'no-store',headers:{'Accept':'text/html'}});
      if(!response.ok)throw new Error(`HTTP ${response.status}`);
      const doc=new DOMParser().parseFromString(await response.text(),'text/html');
      const fresh=doc.getElementById('main-content');
      if(!fresh)throw new Error('main-content fehlt');
      const open=[...main.querySelectorAll('details')].map(node=>node.open);
      const values={};main.querySelectorAll('input[id],select[id],textarea[id]').forEach(node=>{values[node.id]=node.value;});
      const top=window.scrollY;
      main.replaceChildren(...[...fresh.childNodes].map(node=>document.importNode(node,true)));
      main.querySelectorAll('details').forEach((node,index)=>{if(index<open.length)node.open=open[index];});
      Object.entries(values).forEach(([id,value])=>{const node=byId(id);if(node&&main.contains(node))node.value=value;});
      if(doc.title)document.title=doc.title;
      window.scrollTo(0,top);
      filter();
      viewRenderedAt=Date.now();viewError=null;
    }catch(error){viewError=error;}
    finally{clearTimeout(timeout);viewRefreshing=false;}
  }
  function viewLabel() {
    const age=Date.now()-viewRenderedAt;
    if(viewError&&age>VIEW_STALE_MS)return ['red',`Ansicht vom ${clock(viewRenderedAt)} veraltet – Aktualisierung fehlgeschlagen, klicken zum Wiederholen`];
    if(age>VIEW_STALE_MS)return ['yellow',`Ansicht vom ${clock(viewRenderedAt)} angehalten, solange du hier arbeitest – klicken zum Aktualisieren`];
    return null;
  }
  async function poll(force=false) {
    if(document.hidden)return;status('yellow','Aktualisiere…');
    const controller=new AbortController(), timeout=setTimeout(()=>controller.abort(),8000);
    try{
      const response=await fetch('/api/state',{signal:controller.signal,cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);
      const signature=update(await response.json());retries=0;
      const age=Date.now()-viewRenderedAt;
      const changed=viewSignature!==null&&signature!==viewSignature;
      viewSignature=signature;
      if(force||(changed&&age>=VIEW_MIN_MS)||age>=VIEW_MAX_MS)await refreshView(force);
      const stale=viewLabel();if(stale)status(stale[0],stale[1]);
    }
    catch(error){retries+=1;status(retries>=MAX_RETRIES?'red':'yellow',retries>=MAX_RETRIES?`Verbindung verloren – automatischer Wiederherstellungsversuch ${retries-MAX_RETRIES+1}`:`Temporärer Fehler ${retries}/${MAX_RETRIES}`);}
    finally{clearTimeout(timeout);clearTimeout(timer);if(!document.hidden)timer=setTimeout(poll,retries?2000:INTERVAL_MS);}
  }
  document.addEventListener('visibilitychange', () => {
    clearTimeout(timer);
    if (document.hidden) status('paused', 'Pausiert – Tab im Hintergrund');
    else { retries = 0; poll(); }
  });
  const live=byId('tim-status');if(live)live.addEventListener('click',()=>{clearTimeout(timer);poll(true);});
  const filter=()=>{const statusValue=byId('filter-status')?.value||'',typeValue=(byId('filter-type')?.value||'').toLowerCase(),ruleValue=(byId('filter-rule')?.value||'').toLowerCase(),period=byId('filter-period')?.value||'';document.querySelectorAll('tbody tr[data-status]').forEach(row=>{let ok=!statusValue||(statusValue==='ACTIVE'?['OPEN','MONITORING','COLLECTING_EVIDENCE','READY_FOR_REVIEW'].includes(row.dataset.status):row.dataset.status===statusValue);ok=ok&&(!typeValue||(row.dataset.type||'').toLowerCase().includes(typeValue));ok=ok&&(!ruleValue||(row.dataset.rule||'').toLowerCase().includes(ruleValue));if(ok&&period&&row.dataset.time){const age=Date.now()-new Date(row.dataset.time).getTime();ok=age<=Number(period)*86400000;}row.hidden=!ok;});};
  document.addEventListener('input',event=>{if(event.target.closest&&event.target.closest('.filters'))filter();});
  const presetStatus=new URLSearchParams(location.search).get('status');const statusSelect=byId('filter-status');if(presetStatus&&statusSelect&&[...statusSelect.options].some(o=>o.value===presetStatus)){statusSelect.value=presetStatus;filter();}
  function showResearch(target,data,deep=false){const box=byId(target);if(!box)return;box.replaceChildren();const pre=document.createElement('pre');pre.className='code';pre.textContent=data.error||(!data.result?'Kein Ergebnis':deep?`Report: ${data.result.report_id||'—'}\n${data.result.word_count||0} Wörter • ${data.result.sources||0} Quellen`:`${data.result.summary||''}\nPatterns: ${(data.result.patterns||[]).join(', ')||'keine'}`);box.appendChild(pre);if(deep&&data.result?.download_url){const link=document.createElement('a');link.href=data.result.download_url;link.textContent='Markdown-Bericht öffnen';link.target='_blank';link.rel='noopener';box.appendChild(link);}}
  async function research(endpoint,query,target,extra={}){const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,...extra})});showResearch(target,await response.json(),endpoint.endsWith('/deep'));}
  document.addEventListener('click',event=>{
    const button=event.target.closest&&event.target.closest('#quick-run,#deep-run');if(!button)return;
    if(button.id==='quick-run')research('/api/research/quick',byId('quick-query').value,'quick-results');
    else research('/api/research/deep',byId('deep-query').value,'deep-results',{type:byId('report-type').value});
  });
  poll();
})();
</script>
