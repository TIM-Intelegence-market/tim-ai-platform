# TIM SonarQube Cloud configuration
# Phase 5 — SonarQube Cloud (v2.0)
sonar.projectKey=uezeyiraydin-cell_tim-ai-platform
sonar.organization=uezeyiraydin-cell

sonar.sources=src,main.py,config
sonar.tests=tests
sonar.python.version=3.13

sonar.sourceEncoding=UTF-8
sonar.exclusions=scripts/**,docs/**,artifacts/**,data/**

sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=tests/**,src/database/migrations/**,*.command

sonar.junit.reportsPath=artifacts/github_toolchain/pytest_full.junit.xml

sonar.qualitygate.wait=false
sonar.verbose=false

sonar.links.homepage=https://github.com/uezeyiraydin-cell/tim-ai-platform
sonar.links.scm=https://github.com/uezeyiraydin-cell/tim-ai-platform.git
