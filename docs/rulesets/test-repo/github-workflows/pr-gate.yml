# FIXTURE for the private ruleset test repository only (copy to .github/workflows/pr-gate.yml there).
# Posts the same commit status context as the production gate (pr-gate/head), from github-actions[bot].
name: PR gate

on:
  pull_request_target:
    branches: [platform-main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

jobs:
  gate:
    name: PR gate
    runs-on: ubuntu-latest
    steps:
      - name: Report the probe result on the head SHA
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/contents/PROBE_GATE_FAIL?ref=$HEAD_SHA" >/dev/null 2>&1; then
            state=failure
          else
            state=success
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" -f context=pr-gate/head -f description="probe gate" -f target_url="$RUN_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
