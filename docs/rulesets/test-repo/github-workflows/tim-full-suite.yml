# FIXTURE for the private ruleset test repository only (copy to .github/workflows/tim-full-suite.yml there).
name: TIM full suite

on:
  pull_request:
    branches: [platform-main]

permissions:
  contents: read

jobs:
  test:
    name: TIM full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Red when the probe asks for it
        run: test ! -f PROBE_RED_FULL
