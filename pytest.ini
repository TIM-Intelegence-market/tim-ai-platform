[pytest]
testpaths = tests
markers =
    local_env: needs files or a runtime that exist only on the developer machine (local artifacts, .venv-research, running Ollama, Graphify executable); excluded in CI via -m 'not local_env'
    serial: set automatically in tests/conftest.py for tests that scan the real repository; CI runs them after the parallel step, not alongside it
    xdist_group: pytest-xdist scheduling group (set automatically in tests/conftest.py for modules using the PostgreSQL test database)
    real_create_authority: tests/task_governance only: build gateways with the production default (no authority) instead of an unrestricted one
