<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mac-Worker</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#626b76;--line:#e2e5e9;--ok:#1a7f4b;--warn:#a15c00;--bad:#b42318;--accent:#2457c5;--chip:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171c23;--text:#e6e9ed;--muted:#97a1ad;--line:#262d36;--ok:#4cc38a;--warn:#e5a54b;--bad:#f07167;--accent:#7ea6ff;--chip:#212831}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:16px}
h1{font-size:22px;margin:0}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:28px 0 10px}
.meta{color:var(--muted);font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.bg-ok{background:var(--ok)}.bg-warn{background:var(--warn)}.bg-bad{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.big{font-size:18px;font-weight:600}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px}
.chip{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 7px;font-size:12px;margin:2px 4px 0 0}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
ol.timeline{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:13px}
ol.timeline li{margin:2px 0}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:6px}
.empty{color:var(--muted);font-style:italic}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:var(--muted);margin:6px 0 0}
</style>
</head>
<body>
<main>
<header><h1>Mac-Worker (Qwen)</h1><span class="meta" id="updated">lädt…</span></header>
<div class="pills" id="pills"></div>
<h2>Aktuell</h2><div id="current"></div>
<h2>Offen</h2><div id="open"></div>
<h2>Erledigt</h2><div id="done"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
const link=(href,text)=>{const a=el('a',null,text);if(/^https:\/\/github\.com\//.test(href||''))a.href=href;a.target='_blank';a.rel='noopener';return a};
const iso=s=>s?Math.floor(Date.parse(s)/1000):null;
const when=t=>t?new Date(t*1000).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'–';
function dur(a,b){if(!a||!b||b<a)return '–';let s=b-a,h=Math.floor(s/3600),m=Math.round(s%3600/60);return h?`${h} h ${m} min`:`${m} min`}
function ago(t){if(!t)return '–';return dur(t,Math.floor(Date.now()/1000))+' her'}
function pill(state,text){const p=el('span','pill');p.append(el('span','dot bg-'+state),text);return p}
function timeline(events){const ol=el('ol','timeline');for(const e of events||[]){const li=el('li',null,`${when(e.at)} · ${e.phase}`);if(e.detail){const d=el('details');d.append(el('summary',null,'Details'),el('pre',null,e.detail));li.append(d)}ol.append(li)}return ol}
function chips(list){const s=el('div');for(const h of list||[])s.append(el('span','chip',h));return s}

function render(d){
  $('#updated').textContent='Stand '+new Date(d.generated_at*1000).toLocaleTimeString('de-DE')+' · aktualisiert alle 10 s';
  const w=d.worker,pills=$('#pills');pills.textContent='';
  pills.append(pill(w.agent.running?'ok':'bad',w.agent.running?`Worker läuft (PID ${w.agent.pid})`:'Worker läuft nicht'));
  pills.append(pill(w.ollama.reachable&&w.ollama.model_installed?'ok':'bad',w.ollama.reachable?(w.ollama.model_installed?`Ollama · ${w.ollama.model}`:`Modell ${w.ollama.model} fehlt`):'Ollama nicht erreichbar'));
  pills.append(pill(d.github.ok?'ok':'warn',d.github.ok?'GitHub erreichbar':(d.github.loading?'GitHub wird geladen…':'GitHub: '+(d.github.error||'Fehler'))));

  const cur=$('#current');cur.textContent='';
  if(d.current){
    const c=el('div','card');
    const r=el('div','row');const t=el('div','big');t.append('Arbeitet an ',link(`https://github.com/TIM-Intelegence-market/tim-ai-platform/issues/${d.current.issue}`,'#'+d.current.issue));
    r.append(t,el('span','meta','seit '+when(d.current.worktree_created_at||d.current.started_at)));
    c.append(r,el('div',null,'Phase: '+d.current.phase),chips(d.current.helpers),timeline(d.current.events));cur.append(c);
  }else{
    const c=el('div','card');
    const intake=d.log.last_intake;
    c.append(el('div','big',w.agent.running?'Wartet auf das nächste Issue':'Kein Lauf aktiv'));
    if(intake&&intake.status==='DONE'&&d.log.idle_polls)c.append(el('div','meta',`${d.log.idle_polls} Abfragen in Folge ohne passendes Issue · Log zuletzt geschrieben ${ago(d.log.stdout_updated_at)}`));
    if(w.agent.running&&d.log.stdout_updated_at){
      const left=d.log.stdout_updated_at+d.log.intake_interval_secs-Math.floor(Date.now()/1000);
      c.append(el('div',null,left>60?`Nächste Prüfung in ca. ${Math.ceil(left/60)} min`:'Nächste Prüfung gleich'));
    }
    cur.append(c);
  }
  const lt=d.log.last_triage,tr=d.triage||{};
  if(lt||tr.last_call_at){
    const c=el('div','card');const m=lt&&lt.text.match(/^Triage: #(\d+) (.*)$/);
    const line=el('div');line.append('Letzte Triage: ');
    if(m){line.append(link(`https://github.com/TIM-Intelegence-market/tim-ai-platform/issues/${m[1]}`,'#'+m[1]),' – '+m[2].replace(/^is not a Mac Qwen task: /,'nicht geeignet: ').replace(/^prepared for the Mac Qwen worker\.?/,'bereit für den Worker'))}else line.append('–');
    if(tr.last_call_at)line.append(' – vor '+dur(tr.last_call_at,Math.floor(Date.now()/1000)));
    c.append(line,el('div','meta',`${tr.calls_last_24h||0} von 30 Triage-Aufrufen in den letzten 24 h verbraucht`));cur.append(c);
  }
  const err=d.log.last_error,errFresh=err&&err.age_estimate_secs<86400;
  if(!errFresh&&!(d.log.last_intake&&d.log.last_intake.status!=='DONE')){cur.append(el('div','card meta','Keine Fehler in den letzten 24 h'))}
  else{
    const since=err?err.intake_polls_since:0;
    const c=el('div','card');c.append(el('div',since?'meta':'warn',since?`Letzter Fehler im Log, vor ca. ${dur(1,1+err.age_estimate_secs)} (danach ${since} Issue-Abfragen ohne Fehler)`:'Letzter Fehler im Log'),el('div',null,(err&&err.text)||(d.log.last_intake&&d.log.last_intake.error)||'BLOCKED'));
    if(err&&err.record){const x=el('details');x.append(el('summary',null,'Log-Eintrag'),el('pre',null,err.record));c.append(x)}
    if(d.log.stderr_tail&&d.log.stderr_tail.length){const x=el('details');x.append(el('summary',null,'Fehler-Log, letzte Zeilen ('+ago(d.log.stderr_updated_at)+')'),el('pre',null,d.log.stderr_tail.join('\n')));c.append(x)}
    cur.append(c);
  }
  for(const s of d.stalled||[]){
    const c=el('div','card');const r=el('div','row');const t=el('div');t.append(el('span','bad','Liegen geblieben: '),link(`https://github.com/TIM-Intelegence-market/tim-ai-platform/issues/${s.issue}`,'#'+s.issue));
    r.append(t,el('span','meta',`${s.attempts} Versuch(e)`));c.append(r,chips(s.helpers),timeline(s.events));cur.append(c);
  }

  const open=$('#open');open.textContent='';
  if(!d.open.length)open.append(el('div','card empty',d.github.ok?'Keine offenen Issues.':(d.github.loading?'GitHub wird geladen…':'GitHub nicht abrufbar.')));
  const issueCard=i=>{
    const c=el('div','card');const r=el('div','row');const t=el('div');t.append(link(i.url,'#'+i.number),' '+i.title);
    const cls={ready:'ok',triage:'warn',blocked:'bad'}[i.stage]||'meta';
    r.append(t,el('span',cls,i.eligible?`bereit · ${i.priority}`:i.waiting_reason));
    c.append(r);const ch=el('div');for(const l of i.labels)ch.append(el('span','chip',l));c.append(ch);return c};
  const groups=[['ready','Bereit für den Worker'],['triage','Wartet auf Triage'],['blocked','Blockiert'],['skipped','Nicht für den Worker']];
  const byPrio=(a,b)=>((a.priority||'P9')>(b.priority||'P9')?1:(a.priority||'P9')<(b.priority||'P9')?-1:0)||b.number-a.number;
  for(const [stage,label] of groups){
    const items=d.open.filter(i=>(i.stage||'skipped')===stage).sort(byPrio);
    const box=el('div');
    const head=el('div','meta',`${label} (${items.length})`);head.style.margin='12px 0 6px';box.append(head);
    if(!items.length)box.append(el('div','card empty','Keine.'));
    for(const i of items)box.append(issueCard(i));
    open.append(box);
  }

  const done=$('#done');done.textContent='';
  if(!d.done.length)done.append(el('div','card empty','Noch keine PRs vom Worker.'));
  for(const p of d.done){
    const c=el('div','card');const r=el('div','row');const t=el('div');
    t.append(link(`https://github.com/TIM-Intelegence-market/tim-ai-platform/issues/${p.issue}`,'#'+p.issue),' → ',link(p.pr_url,'PR #'+p.pr_number),' '+p.title.replace(/^fix\(issue-\d+\):\s*/,''));
    const state={MERGED:['ok','gemergt'],OPEN:['warn','PR offen'],CLOSED:['bad','PR geschlossen']}[p.state]||['meta',p.state];
    r.append(t,el('span',state[0],state[1]));c.append(r);
    const end=iso(p.merged_at)||iso(p.closed_at);
    c.append(el('div','meta',`Lauf ${dur(p.run_started_at,iso(p.pr_created_at))} bis PR · ${end?'bis Merge '+dur(iso(p.pr_created_at),end)+' · ':''}${p.attempts} Versuch(e) · ${when(end||iso(p.pr_created_at))}`));
    c.append(chips(p.helpers));
    if(p.events&&p.events.length){const x=el('details');x.append(el('summary',null,'Verlauf'),timeline(p.events));c.append(x)}
    done.append(c);
  }
}
async function poll(){try{const r=await fetch('/api/status',{cache:'no-store'});render(await r.json())}catch(e){$('#updated').textContent='Dashboard-Dienst nicht erreichbar'}}
poll();setInterval(poll,10000);
</script>
</body>
</html>
