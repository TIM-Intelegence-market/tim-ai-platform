name: PR gate

# pull_request_target runs this workflow from the BASE branch, so a pull request
# cannot change the gate it is judged by. The PR head is fetched as git objects
# only: it is never checked out, installed or executed here.
on:
  pull_request_target:
    branches: [platform-main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  gate:
    name: PR gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch PR head as data only
        run: git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - name: Check changed paths and modes
        run: >-
          python3 scripts/pr_gate.py
          --policy .github/pr-gate-policy.json
          --base "$BASE_SHA" --head refs/remotes/pr/head --branch "$HEAD_REF"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
