name: DCO

# Every commit in a pull request needs a "Signed-off-by:" line matching its author
# (git commit -s). See CONTRIBUTING.md, section "License and sign-off".
on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    # Bots (Dependabot) cannot sign off; their PRs are reviewed by a maintainer instead.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if ! git log -1 --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::Commit $sha has no 'Signed-off-by: $author' line."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Fix: git rebase --signoff $BASE_SHA && git push --force-with-lease"
            exit 1
          fi
          echo "All commits are signed off."
