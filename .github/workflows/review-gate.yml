name: Review gate

# Paket P3 (docs/MULTI_AGENTEN_SYSTEM.md): a PR touching a critical path needs a REVIEWER handover slip
# (TIM_HANDOVER_V1) in its text. Not a required check: Uzi's "merge" stays the only release (R2, 26.10.2026).
# GitHub-hosted runner on purpose: the repository is public, PR code never runs on the Mac or server runners.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  review-gate:
    name: Review gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check reviewer slip on critical paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # --no-renames: a moved critical file counts with its old path too.
        # The gate runs from the base commit, so a PR cannot weaken the check that judges it.
        run: |
          git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          if [ -f "$RUNNER_TEMP/base/src/agents/review_gate.py" ]; then
            cd "$RUNNER_TEMP/base"
          else
            echo "BOOTSTRAP: base has no review gate yet, running the PR's own copy once"
          fi
          python -m src.agents.review_gate --event "$GITHUB_EVENT_PATH" --files "$RUNNER_TEMP/changed.txt"
