name: tests

on:
  pull_request:
  push:
    branches: [platform-main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      timescaledb:
        # Same image and credentials as docker-compose.yml / config/settings.py defaults.
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: tim
          POSTGRES_USER: tim
          POSTGRES_PASSWORD: tim_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tim -d tim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Tests marked local_env need files or a runtime that exist only on the
      # developer machine (see tests/conftest.py); everything else runs here.
      - run: python -m pytest -q -m "not local_env"
