name: CI Linux probe

# Temporary probe for the CI runner tim-core-01-ci on tim-core-01 (ops/linux/README.md); the server must be in
# CI mode (sudo tim-mode ci).
# Runs the same steps as the `test` job in ci.yml, but only on the new runner (label tim-ci-linux), so the
# Mac runner and the required checks are not touched. It never reaches platform-main: workflow_dispatch
# only works for workflows on the default branch, so the probe starts on a push to this branch, and only
# when the commit message contains [linux-probe] (no queued job while the server is still off).
# Remove this file and the tim-ci-linux label once ci.yml runs on both runners.
on:
  push:
    branches:
      - claude/project-thread-gazzam

permissions:
  contents: read

concurrency:
  group: ci-linux-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[linux-probe]')
    runs-on: [self-hosted, Linux, tim-ci-linux]
    timeout-minutes: 40
    # Same isolated test database as on the Mac: PostgreSQL 16 on 127.0.0.1:5434, database tim_test,
    # role tim (tests/conftest.py refuses any other target).
    steps:
      - uses: actions/checkout@v7
      # python3.13 comes from the runner user's PATH (set up in package 1, distro package or uv).
      - name: Set up Python 3.13 (runner PATH)
        run: |
          command -v python3.13
          python3.13 --version
          python3.13 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Show runner facts
        run: |
          echo "runner=$RUNNER_NAME os=$RUNNER_OS arch=$RUNNER_ARCH"
          nproc
          free -h
          locale
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "coverage>=7.4,<8" "pytest-cov>=5,<6" "pytest-xdist>=3.6,<4"
      # Identical pytest calls to the test job in ci.yml, so the counts are comparable with the Mac.
      - name: Run test suite with coverage
        run: |
          python -m pytest tests/ -q -m "not local_env and not serial" -n 4 --dist loadgroup \
            --cov=src --cov-report= \
            --junitxml=artifacts/github_toolchain/pytest_full.junit.xml
          python -m pytest tests/ -q -m "serial and not local_env" \
            --cov=src --cov-append --cov-report=xml:coverage.xml \
            --junitxml=artifacts/github_toolchain/pytest_serial.junit.xml
        env:
          COVERAGE_CORE: sysmon
          TIM_RUNTIME_ENV: test
          TIM_ALLOW_DATABASE_URL_ENV_FOR_TESTS: "true"
          TIM_DATABASE_SECRET_PROVIDER: url-env
          TIM_DURABLE_TEST_DATABASE_URL: postgresql://tim:tim_ci_only@127.0.0.1:5434/tim_test
      - name: Upload JUnit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-junit-linux-probe
          path: |
            artifacts/github_toolchain/pytest_full.junit.xml
            artifacts/github_toolchain/pytest_serial.junit.xml
