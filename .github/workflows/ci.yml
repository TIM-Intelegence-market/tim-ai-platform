name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'opencode/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tim
          POSTGRES_USER: tim
          POSTGRES_PASSWORD: tim_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tim -d tim"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "coverage>=7,<8" "pytest-cov>=5,<6"
      - name: Run test suite with coverage
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=xml:coverage.xml \
            --junitxml=artifacts/github_toolchain/pytest_full.junit.xml
        env:
          TIM_RUNTIME_ENV: test
          TIM_ALLOW_DATABASE_URL_ENV_FOR_TESTS: "true"
          TIM_DATABASE_SECRET_PROVIDER: url-env
          TIM_DATABASE_URL: postgresql://tim:tim_ci_only@127.0.0.1:5432/tim
      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false
      - name: Upload JUnit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: artifacts/github_toolchain/pytest_full.junit.xml

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
