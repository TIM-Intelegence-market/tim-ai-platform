name: CI

# Runs on GitHub-hosted runners only. This public repository has no self-hosted runner, so code from
# a pull request (including forks) never runs on a maintainer's machine.
on:
  push:
    branches:
      - platform-main
  pull_request:
  workflow_dispatch:
  # CodeQL runs nightly instead of after every merge (see the codeql job).
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'schedule'
    # Public repository: every job runs on GitHub-hosted runners (free for public repositories).
    # Pull requests from forks never reach a self-hosted machine.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Isolated test database only (tests/conftest.py refuses any other target): PostgreSQL 16 as a
    # service container on port 5434, database tim_test, role tim. The password is CI-only.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tim
          POSTGRES_PASSWORD: tim_ci_only
          POSTGRES_DB: tim_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U tim -d tim_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "coverage>=7.4,<8" "pytest-cov>=5,<6" "pytest-xdist>=3.6,<4"
      # Tests marked local_env need files, executables or network access that exist
      # only on the developer machine (see pytest.ini); everything else runs here.
      # Speed: step 1 runs on 4 parallel workers (pytest-xdist); modules using the shared PostgreSQL
      # test database stay together on one worker (--dist loadgroup). Step 2 runs the tests marked
      # `serial` (they scan the real repository) alone. Both marks are set in tests/conftest.py.
      # COVERAGE_CORE=sysmon uses Python's low-overhead monitoring API: same coverage numbers,
      # about half the runtime of the default tracer.
      - name: Run test suite with coverage
        run: |
          python -m pytest tests/ -q -m "not local_env and not serial" -n 4 --dist loadgroup \
            --cov=src --cov-report= \
            --junitxml=artifacts/github_toolchain/pytest_full.junit.xml
          python -m pytest tests/ -q -m "serial and not local_env" \
            --cov=src --cov-append --cov-report=xml:coverage.xml \
            --junitxml=artifacts/github_toolchain/pytest_serial.junit.xml
        env:
          COVERAGE_CORE: sysmon
          TIM_RUNTIME_ENV: test
          TIM_ALLOW_DATABASE_URL_ENV_FOR_TESTS: "true"
          TIM_DATABASE_SECRET_PROVIDER: url-env
          TIM_DURABLE_TEST_DATABASE_URL: postgresql://tim:tim_ci_only@127.0.0.1:5434/tim_test
      # Line coverage of src/ as one number in the run summary (Grün-Plan T3): the artifact holds the detail.
      - name: Coverage summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, pathlib
          path = pathlib.Path("coverage.xml")
          if path.exists():
              root = ET.parse(path).getroot()
              print(f"**Zeilenabdeckung src/: {float(root.get('line-rate', 0)) * 100:.1f} %** "
                    f"({root.get('lines-covered')} von {root.get('lines-valid')} Zeilen)")
          else:
              print("Keine coverage.xml (Testlauf abgebrochen).")
          PY
      - name: Upload JUnit and coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-junit
          path: |
            artifacts/github_toolchain/pytest_full.junit.xml
            artifacts/github_toolchain/pytest_serial.junit.xml
            coverage.xml

  report-red-main:
    # strict is off in the ruleset since 25.10.2026: a PR can be green against an older platform-main and
    # still break the merged result. A red push run on platform-main therefore opens (or updates) one
    # issue labelled ci-red, so nobody has to poll the Actions page (Grün-Plan T1). Pull requests and
    # dispatches never report here.
    needs: test
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/platform-main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v8
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = process.env.HEAD_SHA.slice(0, 7);
            const body = `Der Push-Lauf \`test\` auf \`platform-main\` ist rot.\n\n` +
              `- Commit: ${process.env.HEAD_SHA}\n- Lauf: ${process.env.RUN_URL}\n\n` +
              `Regel (CI.md): Ein roter Lauf auf platform-main wird sofort repariert; strict ist aus, ` +
              `deshalb kann ein grüner PR gegen einen älteren Stand das hier auslösen.`;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'ci-red', per_page: 5 });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body: `Erneut rot nach ${sha}.\n\n${body}` });
              return;
            }
            await github.rest.issues.create({ owner, repo, title: `[CI] platform-main rot nach ${sha}`, body, labels: ['ci-red'] });

  codeql:
    # Not a merge gate: runs nightly on platform-main and on manual dispatch only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      # Code scanning is not enabled in the repository settings yet, so uploading
      # fails with a configuration error. The analysis still runs and its SARIF is
      # kept as an artifact. After enabling code scanning (Settings → Code security),
      # drop `upload: never` and the artifact step.
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
