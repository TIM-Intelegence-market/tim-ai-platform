name: CI

# Runs on the self-hosted runners with the label tim-ci (Mac mini, and tim-core-01 while it is in CI mode),
# which use no GitHub Actions minutes; setup and isolation in docs/CI_SELF_HOSTED_RUNNER.md. Feature branches are
# tested through their pull request, so a push to a PR branch no longer starts a second identical run.
on:
  push:
    branches:
      - platform-main
  pull_request:
  workflow_dispatch:
  # CodeQL runs nightly instead of after every merge (see the codeql job).
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read

# Runners are few and often just the Mac: a newer push to the same PR replaces its queued run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'schedule'
    # Any tim-ci runner: the Mac mini always, tim-core-01 only in CI mode (ops/linux/README.md), so
    # this job never depends on the server alone.
    runs-on: [self-hosted, tim-ci]
    # The parallel run needs a few minutes; the margin covers a busy Mac.
    timeout-minutes: 40
    # Isolated test database only (tests/conftest.py refuses any other target): PostgreSQL 16 on the
    # runner host, port 5434, database tim_test, role tim, set up by ops/macos/setup_ci_runner.sh or
    # ops/linux/setup_ci_runner.sh. Service containers are not available on macOS runners.
    steps:
      - uses: actions/checkout@v7
      # setup-python cannot install on the Mac: the macOS Python package hardcodes
      # /Users/runner/hostedtoolcache. Each runner brings Python 3.13 from its setup script instead:
      # Homebrew's python@3.13 on macOS, Debian's python3.13 on Linux.
      - name: Set up Python 3.13
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then python=/opt/homebrew/bin/python3.13; else python=/usr/bin/python3.13; fi
          "$python" -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "coverage>=7.4,<8" "pytest-cov>=5,<6" "pytest-xdist>=3.6,<4"
      # Tests marked local_env need files, executables or network access that exist
      # only on the developer machine (see pytest.ini); everything else runs here.
      # Speed: step 1 runs on 4 parallel workers (pytest-xdist); modules using the shared PostgreSQL
      # test database stay together on one worker (--dist loadgroup). Step 2 runs the tests marked
      # `serial` (they scan the real repository) alone. Both marks are set in tests/conftest.py.
      # COVERAGE_CORE=sysmon uses Python's low-overhead monitoring API: same coverage numbers,
      # about half the runtime of the default tracer.
      - name: Run test suite with coverage
        run: |
          python -m pytest tests/ -q -m "not local_env and not serial" -n 4 --dist loadgroup \
            --cov=src --cov-report= \
            --junitxml=artifacts/github_toolchain/pytest_full.junit.xml
          python -m pytest tests/ -q -m "serial and not local_env" \
            --cov=src --cov-append --cov-report=xml:coverage.xml \
            --junitxml=artifacts/github_toolchain/pytest_serial.junit.xml
        env:
          COVERAGE_CORE: sysmon
          TIM_RUNTIME_ENV: test
          TIM_ALLOW_DATABASE_URL_ENV_FOR_TESTS: "true"
          TIM_DATABASE_SECRET_PROVIDER: url-env
          TIM_DURABLE_TEST_DATABASE_URL: postgresql://tim:tim_ci_only@127.0.0.1:5434/tim_test
      - name: Upload coverage to Codecov
        if: success()
        # Optional report: the Codecov action needs gpg, which the Mac runner does not have.
        continue-on-error: true
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false
      - name: Upload JUnit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-junit
          path: |
            artifacts/github_toolchain/pytest_full.junit.xml
            artifacts/github_toolchain/pytest_serial.junit.xml

  codeql:
    # Not a merge gate and over 20 minutes on the single Mac runner, where it held up every PR queued
    # behind a merge. Runs nightly on platform-main and on manual dispatch only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, tim-ci]
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      # Code scanning is not enabled in the repository settings yet, so uploading
      # fails with a configuration error. The analysis still runs and its SARIF is
      # kept as an artifact. After enabling code scanning (Settings → Code security),
      # drop `upload: never` and the artifact step.
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
